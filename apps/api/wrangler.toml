name = "skillbridge-api"
main = "src/index.ts"
compatibility_date = "2024-09-23"

# Local/dev only. In production set the real secret with:
#   wrangler secret put JWT_SECRET
[vars]
ENVIRONMENT = "production"
FRONTEND_URL = "https://skillbridge-xgq.pages.dev"

[[d1_databases]]
binding = "DB"
database_name = "skillbridge"
database_id = "c38dab7f-2c51-4bca-9232-5c2873f2aa11"

[[r2_buckets]]
binding = "BUCKET"
bucket_name = "skillbridge-uploads"

[[durable_objects.bindings]]
name = "CHAT_ROOM"
class_name = "ChatRoom"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["ChatRoom"]

[ai]
binding = "AI"

# Uncomment for production (custom domain / Pages origin):
# [vars]
# FRONTEND_URL = "https://skillbridge.pages.dev"
